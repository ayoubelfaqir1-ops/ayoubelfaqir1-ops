<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 72" width="900" height="72" role="img" aria-label="GitHub Stats">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C1272D"/><stop offset="1" stop-color="#F5B84B"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5B84B"/><stop offset="1" stop-color="#C1272D" stop-opacity="0"/></linearGradient></defs>
<rect x="4" y="9" width="54" height="54" rx="15" fill="url(#g)"><animate attributeName="opacity" values=".85;1;.85" dur="3s" repeatCount="indefinite"/></rect>
<rect x="4" y="9" width="54" height="54" rx="15" fill="none" stroke="#F5B84B" stroke-opacity=".6"><animate attributeName="stroke-opacity" values=".6;0;.6" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-width" values="1;8;1" dur="3s" repeatCount="indefinite"/></rect>
<g transform="translate(17 22) scale(1.1)" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></g>
<text x="76" y="38" font-family="'Segoe UI',Ubuntu,Helvetica,Arial,sans-serif" font-size="30" font-weight="800" fill="#e6edf3" letter-spacing=".5">GitHub Stats</text>
<text x="78" y="60" font-family="SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8b98a9">git shortlog -sn</text>
<path d="M340 28 H890" stroke="url(#l)" stroke-width="2" stroke-linecap="round" stroke-dasharray="550" stroke-dashoffset="550"><animate attributeName="stroke-dashoffset" values="550;0;0;550" keyTimes="0;.3;.8;1" dur="7s" repeatCount="indefinite"/></path>
<circle cy="28" r="4" fill="#F5B84B" cx="340"><animate attributeName="cx" values="340;890;890;340" keyTimes="0;.3;.8;1" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.3;.31;1" dur="7s" repeatCount="indefinite"/></circle>
</svg>